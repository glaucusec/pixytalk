name: Bug report
description: Report a reproducible problem. Do not disclose vulnerabilities here.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Use synthetic data and remove credentials from logs."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal example where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit/version, operating system, Node.js, pnpm, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal information, customer data, and secrets.
