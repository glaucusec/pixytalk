name: Feature request
description: Propose an improvement grounded in a user problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Who experiences it, and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the user experience and what success looks like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope
      description: Existing workarounds, simpler approaches, and whether this fits the MVP.
